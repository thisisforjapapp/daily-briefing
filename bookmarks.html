<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bookmarks — Daily Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f0f0f;--surface:#161616;--surface2:#1e1e2e;--border:#272727;--text:#e8e6e0;--muted:#6a6a6a;--muted2:#888;--accent:#7eb8d4;--gold:#c8a96e;--green:#6db86d;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-weight:300;line-height:1.6;min-height:100vh;}
    .site-header{border-bottom:1px solid var(--border);padding:3rem 2rem 2rem;max-width:780px;margin:0 auto;}
    .header-eyebrow{font-size:.68rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.9rem;}
    .header-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(1.8rem,5vw,2.7rem);font-weight:400;color:#fff;line-height:1.15;}
    .header-title em{font-style:italic;color:var(--gold);}
    .header-row{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:.9rem;}
    .header-sub{font-size:.82rem;color:var(--muted2);font-weight:300;}
    .back{font-size:.75rem;color:var(--muted);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:.25rem .7rem;transition:color .18s,border-color .18s;}
    .back:hover{color:var(--text);border-color:var(--accent);}
    main{max-width:780px;margin:0 auto;padding:2rem 2rem 6rem;}
    .sync{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.2rem;margin-bottom:1.8rem;}
    .sync h2{font-family:'Inter',sans-serif;font-size:.78rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem;}
    .sync p{font-size:.78rem;color:var(--muted2);margin-bottom:.8rem;line-height:1.6;}
    .sync-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
    .sync input{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:.82rem;padding:.45rem .7rem;}
    .sync input:focus{outline:none;border-color:var(--accent);}
    .btn{font-size:.74rem;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.45rem .9rem;cursor:pointer;font-family:inherit;transition:color .18s,border-color .18s,background .18s;}
    .btn:hover{border-color:var(--accent);}
    .btn.primary{background:var(--accent);color:#08222e;border-color:var(--accent);font-weight:500;}
    .sync-status{font-size:.74rem;margin-top:.7rem;color:var(--muted2);}
    .sync-status.on{color:var(--green);}
    .toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.6rem;}
    .tbtn{font-size:.72rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.35rem .8rem;cursor:pointer;font-family:inherit;transition:color .18s,border-color .18s;}
    .tbtn:hover{color:var(--text);border-color:var(--accent);}
    .date-group{margin-bottom:1.8rem;}
    .date-label{padding-bottom:.5rem;margin-bottom:.5rem;border-bottom:1px solid var(--border);}
    .date-label-text{font-size:.68rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
    .bm-item{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.75rem .9rem;border:1px solid transparent;border-radius:8px;transition:background .18s,border-color .18s;}
    .bm-item:hover{background:var(--surface);border-color:var(--border);}
    .bm-link{display:flex;flex-direction:column;gap:.25rem;text-decoration:none;color:inherit;min-width:0;flex:1;}
    .bm-cat{font-size:.66rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);}
    .bm-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.1rem;font-weight:600;color:var(--text);line-height:1.3;}
    .bm-remove{flex-shrink:0;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:.9rem;line-height:1;transition:color .18s,border-color .18s;}
    .bm-remove:hover{color:#e88;border-color:#e88;}
    .empty{text-align:center;padding:3.5rem 1rem;color:var(--muted);}
    .empty .big{font-size:2.5rem;margin-bottom:1rem;opacity:.5;}
    .empty a{color:var(--accent);text-decoration:none;}
    footer{border-top:1px solid var(--border);padding:2rem;max-width:780px;margin:0 auto;font-size:.72rem;color:var(--muted);}
    @media(max-width:600px){.site-header{padding:2.2rem 1.2rem 1.6rem;}main{padding:1.6rem 1.2rem 5rem;}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-eyebrow">Daily Briefing</div>
    <h1 class="header-title">&#x1F516; <em>Bookmarks</em></h1>
    <div class="header-row">
      <span class="header-sub" id="count">Your saved cards</span>
      <a class="back" href="index.html">&larr; All Briefings</a>
    </div>
  </header>
  <main>
    <section class="sync">
      <h2>&#x1F504; Cross-device sync</h2>
      <p>Enter the same secret <b>sync code</b> on each device (phone, laptop) to keep your bookmarks in sync. Pick anything 6+ characters &mdash; treat it like a password.</p>
      <div class="sync-row">
        <input id="code" type="text" placeholder="your-sync-code" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn primary" id="connectBtn" onclick="connect()">Connect</button>
        <button class="btn" id="syncBtn" onclick="syncNow()" style="display:none">Sync now</button>
        <button class="btn" id="disconnectBtn" onclick="disconnect()" style="display:none">Disconnect</button>
      </div>
      <div class="sync-status" id="syncStatus"></div>
    </section>

    <div class="toolbar" id="toolbar" style="display:none">
      <button class="tbtn" onclick="exportPDF()">&#x1F4C4; Export PDF</button>
      <button class="tbtn" onclick="bmExport()">&#x2B07; Export JSON</button>
      <button class="tbtn" onclick="bmImport()">&#x2B06; Import JSON</button>
      <button class="tbtn" onclick="bmClear()">&#x2715; Clear all</button>
    </div>
    <div id="list"></div>
    <input type="file" id="importer" accept="application/json" style="display:none">
  </main>
  <footer>&copy; 2026 Edward Chan &middot; Powered by curiosity</footer>

<script src="bm.js"></script>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function fileDate(fn){var m=/(\d{4})-(\d{2})-(\d{2})(?:-(\d+))?/.exec(fn||'');return m?(m[1]+m[2]+m[3]+(m[4]?('0'+m[4]).slice(-2):'01')):'00000000';}
function cardNum(id){var m=/card-(\d+)/.exec(id||'');return m?parseInt(m[1],10):99;}

function render(){
  var a=BM.items();
  var list=document.getElementById('list');
  var count=document.getElementById('count');
  var toolbar=document.getElementById('toolbar');
  if(!a.length){
    list.innerHTML='<div class="empty"><div class="big">&#x1F516;</div><p>No bookmarks yet.</p><p style="margin-top:.6rem">Open any briefing and tap the &#x1F516; on a card to save it here.</p><p style="margin-top:1rem"><a href="index.html">Browse briefings &rarr;</a></p></div>';
    count.textContent='Your saved cards'; toolbar.style.display='none'; return;
  }
  toolbar.style.display='flex';
  count.textContent=a.length+' saved card'+(a.length>1?'s':'');
  var groups=[],idx={};
  a.forEach(function(b){var key=b.file;if(idx[key]==null){idx[key]=groups.length;groups.push({file:key,date:b.date||key,items:[]});}groups[idx[key]].items.push(b);});
  // chronological: newest briefing first; within a day, by card order
  groups.sort(function(x,y){return fileDate(y.file).localeCompare(fileDate(x.file));});
  groups.forEach(function(g){g.items.sort(function(x,y){return cardNum(x.id)-cardNum(y.id);});});
  var html='';
  groups.forEach(function(g){
    html+='<div class="date-group"><div class="date-label"><span class="date-label-text">'+esc(g.date)+'</span></div>';
    g.items.forEach(function(b){
      html+='<div class="bm-item"><a class="bm-link" href="'+esc(b.file)+'#'+esc(b.id)+'">'+
        '<span class="bm-cat">'+esc(b.label)+'</span><span class="bm-title">'+esc(b.title)+'</span></a>'+
        '<button class="bm-remove" title="Remove" onclick="removeItem(\''+esc(b.file)+'\',\''+esc(b.id)+'\')">&#x2715;</button></div>';
    });
    html+='</div>';
  });
  list.innerHTML=html;
}
function removeItem(file,id){BM.remove(file,id);render();}
function bmClear(){if(confirm('Remove all bookmarks (on every synced device)?')){BM.clear();render();}}
function bmExport(){var blob=new Blob([BM.exportData()],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='daily-learning-bookmarks.json';a.click();URL.revokeObjectURL(url);}
function bmImport(){document.getElementById('importer').click();}
document.getElementById('importer').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{BM.importData(r.result);render();alert('Imported.');}catch(err){alert('That file could not be read as bookmarks.');}};r.readAsText(f);});

function refreshSync(){
  var code=BM.getCode();
  var status=document.getElementById('syncStatus');
  document.getElementById('code').value=code;
  document.getElementById('syncBtn').style.display=code?'inline-block':'none';
  document.getElementById('disconnectBtn').style.display=code?'inline-block':'none';
  document.getElementById('connectBtn').textContent=code?'Update code':'Connect';
  if(code){status.className='sync-status on';status.innerHTML='&#x2713; Syncing. Use code <b>'+esc(code)+'</b> on your other devices.';}
  else{status.className='sync-status';status.textContent='Not syncing — bookmarks stay on this device only.';}
}
function connect(){
  try{BM.setCode(document.getElementById('code').value);}catch(e){alert(e.message);return;}
  refreshSync();
  if(BM.getCode()){document.getElementById('syncStatus').textContent='Syncing…';BM.syncNow().then(function(res){refreshSync();render();if(!res.ok)document.getElementById('syncStatus').innerHTML+=' <span style="color:#e88">(could not reach server)</span>';});}
}
function syncNow(){var s=document.getElementById('syncStatus');s.textContent='Syncing…';BM.syncNow().then(function(res){refreshSync();render();if(!res.ok)s.innerHTML+=' <span style="color:#e88">(could not reach server)</span>';});}
function disconnect(){BM.setCode('');refreshSync();}

/* ---- Export bookmarked cards as a single combined PDF ---- */
var PDF_LIGHT = '<style>'+
  ':root{--bg:#fff;--surface:#fff;--surface2:#f4f4f6;--border:#d8d8d8;--text:#1c1c1c;--muted:#666;--muted2:#666;'+
  '--accent:#1a5e85;--accent-dim:#1a5e85;--amber:#9a6a00;--amber-bg:#fbf4e6;--amber-border:#e6d6b0;--green:#2e7d32;'+
  '--steel:#3a5a7a;--spark:#f1f0f7;--spark-border:#d8d4ea;}'+
  'html,body{background:#fff!important;color:#1c1c1c!important;}'+
  '.sticky-top,.back-bar,.toc-bar,.side-nav,.header-toolbar,.bm-btn,.bm-flash{display:none!important;}'+
  '.page-layout{display:block!important;padding:0!important;max-width:none!important;}'+
  '.card,.connection-section,.spark-section{page-break-inside:avoid;break-inside:avoid;margin:0 0 1.1rem!important;}'+
  '.card img,.card-img-wrap img{max-height:300px;}'+
  '.pdf-src{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:#888;margin:.2rem 0 .35rem;}'+
  '.pdf-head{font-family:Georgia,serif;font-size:1.5rem;color:#111;margin:0 0 1.2rem;}'+
  'details{margin:.4rem 0;} details>summary{display:none;} '+   /* show answers/predictions inline in PDF */
  '@media print{body{padding:0;} a{color:inherit;text-decoration:none;}}'+
  '*{-webkit-print-color-adjust:exact;print-color-adjust:exact;}'+
  '</style>';

async function exportPDF(){
  var items=BM.items();
  if(!items.length){alert('No bookmarks to export.');return;}
  // chronological order: newest day first, card order within a day
  items=items.slice().sort(function(x,y){
    var d=fileDate(y.file).localeCompare(fileDate(x.file));
    return d!==0?d:cardNum(x.id)-cardNum(y.id);
  });
  var status=document.getElementById('syncStatus');
  var prevStatus=status.innerHTML, prevClass=status.className;
  status.className='sync-status'; status.textContent='Building PDF…';
  // open the print window NOW (within the click gesture) to avoid popup blocking
  var w=window.open('','_blank');
  if(w) w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Loading…</title></head><body style="font-family:sans-serif;padding:2rem;color:#333">Preparing your bookmarks PDF…</body></html>');
  try{
    var files=items.map(function(b){return b.file;}).filter(function(v,i,a){return a.indexOf(v)===i;});
    var docs={}, style='';
    for(var i=0;i<files.length;i++){
      var html=await fetch(files[i]).then(function(r){return r.text();});
      var doc=new DOMParser().parseFromString(html,'text/html');
      docs[files[i]]=doc;
      if(!style){var st=doc.querySelector('head style'); if(st) style=st.outerHTML;}
    }
    var body='';
    items.forEach(function(b){
      var doc=docs[b.file]; if(!doc) return;
      var card=doc.getElementById(b.id); if(!card) return;
      var c=card.cloneNode(true);
      c.querySelectorAll('.bm-btn').forEach(function(e){e.remove();});
      c.querySelectorAll('details').forEach(function(d){d.setAttribute('open','');}); // reveal answers
      body+='<div class="pdf-src">'+esc(b.date||b.file)+'</div>'+c.outerHTML;
    });
    var out='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">'+
      '<title>Daily Learning — Bookmarks</title>'+style+PDF_LIGHT+'</head>'+
      '<body><div class="page-layout"><div class="content" style="display:block">'+
      '<h1 class="pdf-head">🔖 Bookmarked Cards — '+items.length+'</h1>'+body+
      '</div></div></body></html>';
    if(!w){alert('Please allow pop-ups for this site, then try Export PDF again.');status.innerHTML=prevStatus;status.className=prevClass;return;}
    w.document.open(); w.document.write(out); w.document.close();
    var done=function(){ try{w.focus();w.print();}catch(e){} };
    // give images/fonts a moment to load before printing
    setTimeout(done, 1200);
  }catch(e){
    if(w) try{w.close();}catch(_){}
    alert('Could not build the PDF: '+e);
  }
  status.innerHTML=prevStatus; status.className=prevClass;
}

BM.onChange(render);
refreshSync();
render();
</script>
</body>
</html>
