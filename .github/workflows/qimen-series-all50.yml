name: Qimen complete episode index EP01 to EP50
on:
  push:
    branches: [qimen-ep01-asr-safe-test]
    paths: [.github/workflows/qimen-series-all50.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qimen-series-all50
  cancel-in-progress: true
jobs:
  index:
    if: github.ref == 'refs/heads/qimen-ep01-asr-safe-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Search all 50 public episode records
        run: python qimen_ep01_trial/search_each_episode.py
      - name: Save source index (no video/media)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qimen-series-ep01-ep50
          path: qimen_series_index/series_ep01_ep50.*
          retention-days: 1
